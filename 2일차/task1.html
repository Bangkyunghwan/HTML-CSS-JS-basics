<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <title>task1</title>
        <link rel="icon" type="image/x-icon" href="smile.ico">
    </head>
    <body>
        <label for="id">아이디</label>
        <input type="text" id="id" name="id"><br>
        <label for="pwd">비밀번호</label>
        <input type="password" id="pwd" name="pwd"><br>
        <label for="date">생년월일</label>
        <input type="date" id="date" name="date"><br>
        <label for="gender">성별</label>
        <select name="gender" id="gender">
            <option value="othersGender">기타</option>
            <option value="male">남성</option>
            <option value="female">여성</option>
        </select><br> 
        가입경로<br>
        <input type="radio" id="sheet" name="path" value="sheet">
        <label for="sheet">전단지</label>
        <input type="radio" id="subAd" name="path" value="subAd">
        <label for="subAd">지하철 광고</label>
        <input type="radio" id="othersPath" name="path">
        <!--질문1: 기타가 선택되었을 때만 텍스트를 쓸 수 있게 하고 싶음.-->
        <!-- 질문2: label태그가 인라인 요소라 줄바꿈이 안되는거 같음 br없이 가능?-->
        <label for="otherPath">기타</label>
        <input type="text" id="othersPathText" name="path"><br>


        <label for="introduce">자기소개</label><br>
        <textarea id="introduce" name="introduce" rows="4" cols="30" placeholder="140자 이내로 적어주세요." maxlength="140"></textarea><br>
        <label for="isAgree"><a href="개인정보취급방침.html" target="_blank" title="개인정보취급방침 정의">개인정보취급방침</a>에 동의합니다.</label>
        <input type="checkbox" id="isAgree" name="isAgree" value="agree"><br>
        <input type="submit" value="제출"> 
    </body>
</html>
